name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install (точные версии из lock-файла)
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest

      - name: Lock files are up to date
        if: matrix.python-version == '3.12'
        run: |
          pip install uv
          make lock
          git diff --exit-code requirements.txt requirements-dev.txt \
            || (echo "requirements*.txt устарели: выполните make lock" && exit 1)

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t resto-analytics .
