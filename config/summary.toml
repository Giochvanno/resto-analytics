# Настройки сводки продаж.
# После изменения перезапустите сервис (или передайте --config в CLI).

# По какому столбцу iiko собирать строки сводки: "category" (Категория) или "group" (Группа)
group_by = "category"

# Порядок строк. Группы, которых здесь нет, идут ниже по убыванию продаж.
row_order = ["Бар", "Плов", "Салаты", "Самса", "Лагман", "Шашлыки"]

# Группы или категории, которые не нужно включать в сводку вообще
exclude_groups = []

# В сводке всегда три суммы: продажи без обслуживания, обслуживание и продажи с ним.
# От какой из них считать валовый доход, коэффициент и долю:
#   "without_service" — без обслуживания: наценка на саму еду (обслуживание — плата за зал,
#                       и на доставке его нет)
#   "with_service"    — со всей выручкой, если обслуживание остаётся заведению
margin_base = "without_service"

# Как считать «Обслуживание 10%»:
#   "file"    — из столбца «Сумма скидок» (iiko пишет туда надбавку со знаком минус)
#   "percent" — service_percent % от продаж без обслуживания
#   "none"    — не считать
service_source = "file"
service_percent = 10

# Последний столбец:
#   "share"      — доля группы в общих продажах, %
#   "efficiency" — продажи / себестоимость × 100
last_column = "share"

# Переназначение групп: «Группа» из iiko = строка в сводке.
# В iiko лагман лежит внутри категории «Бар», а в сводке он нужен отдельно.
[group_overrides]
"Лагман" = "Лагман"

[checks]
# Позиции с коэффициентом (продажи / себестоимость) ниже этого — «почти нет наценки»
low_margin_coefficient = 1.3
# Себестоимость единицы меньше 2% от цены — подозрительно, проверьте техкарту
suspicious_cost_ratio = 0.02
# Эти группы не проверяем
skip_groups = ["Штрафы"]
