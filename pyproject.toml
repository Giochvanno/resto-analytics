[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "resto-analytics"
version = "0.3.0"
description = "Сводные отчёты для ресторана из выгрузок iiko: продажи, себестоимость, валовый доход по группам."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arman (Giochvanno)" }]
dependencies = [
    "aiogram>=3.13",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "httpx2>=2.0",  # новые Starlette TestClient используют httpx2 вместо httpx
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-openpyxl>=3.1",
]

[project.scripts]
resto-analytics = "resto_analytics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resto_analytics"]

# ---------- pytest / coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=resto_analytics --cov-report=term-missing --cov-fail-under=90"
markers = [
    "real_data: проверки на настоящей выгрузке iiko (запускаются, только если задан RESTO_REAL_FILE)",
    "libreoffice: пересчёт формул через LibreOffice (пропускается, если его нет)",
]

[tool.coverage.run]
branch = true
source = ["resto_analytics"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT", "C4", "RET", "ARG"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях — это нормально
    "PLR2004",                     # «магические» числа в тестах и порогах
    "PLR0913",                     # у фабрик тестовых данных много аргументов
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG001", "PLR0912"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["resto_analytics"]
plugins = ["pydantic.mypy"]
